<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FF572E">
  <title>Create account | DukaBarg Admin</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#25211f;background:#f8f7f5;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top right,#fff0e9,transparent 38%),#f8f7f5}
    .card{width:min(100%,460px);padding:40px;background:#fff;border:1px solid #e8e5e1;border-radius:22px;box-shadow:0 16px 48px #1717170d}
    .brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:27px;color:#e83d18;font-size:19px;font-weight:800;letter-spacing:-.04em}
    .brand-mark{display:grid;width:38px;height:38px;place-items:center;border-radius:12px;background:#fff0e9;color:#ff572e;font-size:21px}
    h1{margin:0;font-size:27px;letter-spacing:-.04em}.intro{margin:9px 0 21px;color:#777;font-size:14px;line-height:1.6}
    label{display:block;margin:14px 0 7px;font-size:13px;font-weight:650}input{width:100%;height:45px;padding:0 13px;border:1px solid #e8e5e1;border-radius:10px;background:#fff;font:inherit;font-size:14px;outline:none}
    input:focus{border-color:#ff7957;box-shadow:0 0 0 3px #ff572e1a}button{width:100%;height:47px;margin-top:22px;border:0;border-radius:10px;background:#ff572e;color:#fff;font:inherit;font-size:14px;font-weight:700;box-shadow:0 6px 18px #ff572e33;cursor:pointer}
    button:hover{background:#f0441e}button:disabled{opacity:.65;cursor:wait}.footer{margin:22px 0 0;text-align:center;color:#777;font-size:13px}
    a{color:#e83d18;text-decoration:none;font-weight:650}a:hover{text-decoration:underline}.message{display:none;margin:15px 0 0;padding:12px 13px;border-radius:9px;background:#fff4de;color:#76530d;font-size:13px;line-height:1.5}.message.error{background:#fdecec;color:#a12622}.message.success{background:#e7f7ee;color:#176c43}
    @media(max-width:480px){.card{padding:29px 23px}.brand{margin-bottom:22px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="brand-mark" aria-hidden="true">D</span><span>DukaBarg Admin</span></div>
    <h1>Create your account</h1>
    <p class="intro">Register for DukaBarg. Dashboard access is enabled after administrator approval.</p>
    <form id="register-form">
      <label for="name">Full Name</label>
      <input id="name" name="name" type="text" autocomplete="name" maxlength="100" required>
      <label for="mobile">Mobile Number</label>
      <input id="mobile" name="mobile" type="tel" autocomplete="tel" maxlength="20" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
      <button id="register-button" type="submit">Create account</button>
    </form>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <p class="footer">Already registered? <a href="login.html">Sign in</a></p>
  </main>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { createUserWithEmailAndPassword, getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, serverTimestamp, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCc54Az1Y3aN-VfqDdcFTa5R0p8a9oiqfw",
      authDomain: "dukabarg.firebaseapp.com",
      databaseURL: "https://dukabarg-default-rtdb.firebaseio.com",
      projectId: "dukabarg",
      storageBucket: "dukabarg.firebasestorage.app",
      messagingSenderId: "994703153320",
      appId: "1:994703153320:web:d71e07c0b4f72d92280a9d"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);
    const form = document.getElementById("register-form");
    const button = document.getElementById("register-button");
    const message = document.getElementById("message");

    function showMessage(text, kind = "") {
      message.textContent = text;
      message.className = `message ${kind}`;
      message.style.display = "block";
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = "Creating account...";
      try {
        const name = document.getElementById("name").value.trim();
        const mobile = document.getElementById("mobile").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const credential = await createUserWithEmailAndPassword(auth, email, password);
        await set(ref(database, `users/${credential.user.uid}`), {
          uid: credential.user.uid,
          name,
          mobile,
          email: credential.user.email || email,
          role: "user",
          status: "pending",
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });
        showMessage("Your account is ready. Opening DukaBarg dashboard...", "success");
        window.location.replace("index.html");
      } catch (error) {
        if (error.code?.includes("api-key-not-valid")) {
          showMessage("Firebase rejected this app's API key. In Firebase Console, open Project settings → General, copy the Web app configuration, and replace this page's apiKey with the current value. Also check that the Google Cloud API key allows the Identity Toolkit API.", "error");
          return;
        }
        const messages = {
          "auth/email-already-in-use": "An account already exists for this email. Sign in instead.",
          "auth/invalid-email": "Enter a valid email address.",
          "auth/weak-password": "Choose a password with at least 6 characters.",
          "auth/unauthorized-domain": "This website domain is not authorized for Firebase Authentication."
        };
        showMessage(messages[error.code] || error.message || "Registration failed. Please try again.", "error");
      } finally {
        button.disabled = false;
        button.textContent = "Create account";
      }
    });
  </script>
</body>
</html>
